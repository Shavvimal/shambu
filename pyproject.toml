[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shambu"
dynamic = ["version"]
description = "Prepare, inspect and patch Bambu Studio projects (.3mf) and read a Bambu Lab printer over LAN, from the command line and as a Claude Code plugin"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shav Vimalendiran" }]
keywords = ["bambu-lab", "bambu-studio", "3mf", "3d-printing", "slicer", "claude-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Topic :: Printing",
]
dependencies = ["paho-mqtt>=2.1"]

[project.scripts]
shambu = "shambu.cli:main"

[project.urls]
Repository = "https://github.com/Shavvimal/shambu"
Issues = "https://github.com/Shavvimal/shambu/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.version]
path = "src/shambu/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shambu"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "RUF", "T20", "PL", "S"]
# S314: the XML parsed comes from local Bambu Studio project files, not from the network. PLC0415: lazy imports keep
# paho and the pipeline out of `--help`. PLW1510: subprocess results are mapped by hand. SIM105/S110: paho disconnect
# cleanup. PLR0917/PLR0913: dataclass-shaped constructors.
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004", "S603", "S607", "E501", "RUF012", "S324", "PLR0911", "PLW2901", "S108",
          "S314", "PLC0415", "PLW1510", "SIM105", "S110", "PLR0917", "PLW0603", "S104", "RUF005", "SIM102", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["shambu"]

[tool.ruff.lint.per-file-ignores]
"src/shambu/cli.py" = ["T201"]
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Bambu Studio or a printer; skipped unless SHAMBU_INTEGRATION=1"]
